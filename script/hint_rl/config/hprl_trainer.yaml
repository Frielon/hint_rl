# HPRL trainer config = stock ppo_trainer + the HPRL dynamic-budget knobs.
#
# Mirrors recipe/dapo/config/dapo_trainer.yaml: pull verl's base config in via
# the searchpath (resolved relative to the launch cwd = the verl repo root, which
# run_hprl_qwen2.5_7b.sh sets as the Ray working-dir), then layer our additions.
#
# The HPRL flag + knobs live under `data.hprl` because verl passes the data
# config to the dataset (HintBudgetDataset, the injection side) while the trainer
# reads the same node as `config.data.hprl` (the ratchet side) -- one source of
# truth for both. With `data.hprl.enable=false` every HPRL override no-ops and
# this is an ordinary multi-turn GRPO run.

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  # route every training row through the dynamic-budget dataset (injection side).
  custom_cls:
    path: ${oc.env:HINT_RL_HOME}/script/hint_rl/hint_dataset.py
    name: HintBudgetDataset

  # the HPRL dynamic-budget ratchet.
  hprl:
    # master switch. false -> HintBudgetDataset + HPRLRayPPOTrainer are no-ops.
    enable: true
    # shared budget-state JSON: written by the trainer ratchet, read by the
    # dataset. Override per-experiment from the launch script.
    budget_state_path: ${oc.env:HINT_RL_HOME}/logs/hprl_budget_state.json
    # downward-rule knobs (see budget_manager.compute_downward_budget).
    min_budget: 0
    decrement: 1
    # fallback B_q when a row carries no baked budget.
    default_budget: 8
    # tool name whose create_kwargs.budget is injected/enforced.
    tool_name: request_hint
    # RETIRED (no longer changes behavior): an over-budget <hint_call/> is now
    # ALWAYS a terminating protocol violation -- the rollout is flagged
    # (extra_info["hint_budget_exceeded"]) and floored to budget_exceeded_reward
    # (acc=0, answer ungraded) by hint_reward.compute_score. Kept for back-compat.
    terminate_on_budget_exceeded: true
    # hint-selection + penalty strategy. Read by the agent loop (HintAgentLoop);
    # MUST be matched by the reward's custom_reward_function.reward_kwargs.hint_strategy.
    #   "hint"       -> selector reveals ONE hint within the identified major step;
    #                   that hint is excluded next call; per-hint penalty.
    #   "major_step" -> reveal ALL hints of the identified major step at once;
    #                   record + exclude the WHOLE step next call; charge the step
    #                   penalty directly (hint_penalty.applied_step_penalty).
    strategy: hint

    # which already-revealed major steps the NEXT selector prompt drops from the
    # candidate pool (major_step strategy only; agent-loop side, no reward effect):
    #   "applied"    -> drop only the steps actually revealed so far (default;
    #                   hint_selector.exclude_applied_steps).
    #   "cumulative" -> drop EVERY step id <= the latest revealed step -- once step 5
    #                   is revealed, steps 1..5 are removed and only 6, 7, ... remain,
    #                   forcing the selector strictly forward
    #                   (hint_selector.exclude_steps_through_latest).
    step_exclude_mode: cumulative

    # finalize_incorrect: when a rollout ends on an answer turn (no <hint_call/>), the
    # agent loop grades it; if WRONG, it makes ONE final selector call to find the hint
    # the student still needs, and the reward scores the rollout as "correct but consuming
    # the hints from there to the end" (hint_reward.compute_score +
    # hint_penalty.penalty_from_k). MUST be matched by
    # custom_reward_function.reward_kwargs.finalize_incorrect. Adds a blocking selector
    # call per INCORRECT rollout when on. false -> ordinary incorrect scoring.
    finalize_incorrect: true

    # ---- k-pack counterfactual-probe ratchet ("double-rollout" / k-pack) ----------
    # Measure (don't infer) whether one fewer hint would still solve a problem: split
    # EVERY problem's rollout.n rollouts into k packs of rollout.n/k, each FORCED to a
    # different budget B, B-1, ..., B-k+1. Each pack is its own GRPO group; the ratchet
    # pools their correct rollouts and snaps B down to the smallest B' with
    # >= require_successes correct rollouts at <= B' hints
    # (budget_manager.compute_kpack_budget). Reads true need directly, sidestepping the
    # corrupted "model always spends its budget" signal.
    #
    # The per-step rollout TOTAL is unchanged (== train_batch_size * rollout.n): the
    # trainer expands the batch x k AND divides the repeat factor rollout.n by k, so each
    # problem still yields rollout.n rollouts -- just split into k packs of rollout.n/k.
    # REQUIRES rollout.n divisible by k (the trainer raises otherwise). With enable=false
    # this is a pure no-op and the single-pack downward ratchet runs exactly as before.
    kpack:
      enable: false
      # packs per problem: budgets B, B-1, ..., B-k+1 (k=2 == the original double-rollout).
      # rollout.n MUST be divisible by k; each pack gets rollout.n/k rollouts (keep >= 2 so
      # GRPO has within-group variance).
      k: 2
      # corroborating frugal successes required to ratchet (the >=2 guard against a lone
      # answer-leak/fluke solve driving the budget down). 1 == aggressive single-success.
      require_successes: 2
      # scale ppo_mini_batch_size by k so the PPO mini-batch SAMPLE count
      # (ppo_mini_batch_size * rollout.n) is identical to a non-k-pack run -- the update is
      # byte-for-byte unchanged, only the GRPO grouping/budget split differs. false keeps
      # ppo_mini_batch_size as-is (smaller, more-numerous mini-batches).
      scale_mini_batch: true
