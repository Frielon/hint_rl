# HPRL custom agent-loop registry (verl rollout.agent.agent_loop_config_path).
#
# Registers the <hint_call/> rollout under agent_name "hint_agent" -> the dataset
# rows tagged agent_name="hint_agent" (set by prepare_hint_data.py) route here.
# The _target_ is imported from PYTHONPATH (= the script/hint_rl dir, exported by
# the run script), so no verl core edit is needed.
- name: hint_agent
  _target_: hint_agent_loop.HintAgentLoop
# Auto-hint (push-hint) rollout: the loop injects a hint whenever the answer is
# still wrong (no <hint_call/>). Rows tagged agent_name="auto_hint" route here.
- name: auto_hint
  _target_: auto_hint_agent_loop.AutoHintAgentLoop
# Terminate-and-restart (segment-chain) push-hint rollout: on a wrong answer the
# chain restarts from a FRESH recap+hint prompt instead of growing the context.
# Registered here for per-row routing; the usual activation is the registry SWAP
# in hint_agent_config_restart.yaml (auto_hint rows -> RestartHintAgentLoop),
# selected via AGENT_LOOP_CONFIG_PATH by the *_restart launcher.
- name: restart_hint
  _target_: restart_agent_loop.RestartHintAgentLoop
